spring:
  application:
    name: weather-board-api-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    # password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true

openweathermap:
  api:
    apikey: ${OPENWEATHERMAP_API_KEY}

server:
  # Reference variables from .env or OS using ${NAME:DEFAULT}
  port: ${PORT:8080}
  # Global prefix for ALL routes in the application
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.sollo_script.weather_board_api_service: DEBUG
    org.springframework.web: DEBUG
